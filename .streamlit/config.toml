# Streamlit settings for Review Reality.

[browser]
# Do not send anonymous usage statistics to Streamlit.
gatherUsageStats = false

[client]
toolbarMode = "minimal"

[theme]
base = "light"
# One restrained accent colour (deep teal); everything else is neutral.
primaryColor = "#1E5B57"
backgroundColor = "#FAF9F6"
secondaryBackgroundColor = "#F1EFE9"
textColor = "#1D1D1B"
borderColor = "#E3E0D7"
dataframeHeaderBackgroundColor = "#F1EFE9"
linkColor = "#1E5B57"
baseRadius = "0.5rem"
showWidgetBorder = true
# Fonts load from Google Fonts when online; without internet the fallbacks are used.
font = "Inter:https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap, sans-serif"
headingFont = "Newsreader:https://fonts.googleapis.com/css2?family=Newsreader:wght@600&display=swap, serif"
headingFontSizes = ["2rem", "1.45rem", "1.15rem", "1rem"]
chartCategoricalColors = ["#1E5B57", "#8A877E", "#C9C5BA", "#3C3A35"]
